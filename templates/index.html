<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Tracker (CBR)</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/site.css" />
  </head>
  <body class="min-h-screen bg-base-100 text-base-content overflow-x-hidden">
    <div class="navbar bg-base-100 border-b border-base-200/60 py-1">
      <div class="edge-shell">
        <div class="flex w-full items-center justify-between">
          <div class="flex items-center gap-3">
            <a class="btn btn-ghost px-2 text-base font-semibold tracking-tight" href="/">
              <span class="nav-accent">Currency</span><span>Tracker</span>
            </a>
            <span class="hidden sm:inline text-xs text-base-content/70">ЦБ РФ • курс к рублю</span>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <span class="text-xs text-base-content/70">Light</span>
              <input id="themeToggle" type="checkbox" class="toggle toggle-primary toggle-sm" aria-label="Switch theme" />
              <span class="text-xs text-base-content/70">Dark</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <main class="edge-shell py-4 md:py-6">
      <section class="mt-6 grid grid-cols-1 gap-4 xl:mt-10">
        <div class="edge-grid">
        <aside class="card card-border edge-banner edge-banner-left order-2 xl:order-1">
          <div class="card-body gap-3">
            <h2 class="card-title text-base">Популярные</h2>
            <div id="favoritesLeft" class="grid gap-2">
              <div class="text-sm text-base-content/70">Загружаю…</div>
            </div>
          </div>
        </aside>

        <section class="main-pane order-1 xl:order-2 max-w-5xl mx-auto w-full">
          <div id="emptyHint" class="alert alert-warning mb-3 hidden">
            <span class="font-medium">База пуста.</span>
            <span class="text-base-content/80">Нажмите “Синхронизировать сегодня”, чтобы загрузить курсы.</span>
          </div>
          <div id="apiAlert" class="alert alert-error mb-3 hidden">
            <span class="font-medium">Ошибка.</span>
            <span id="apiAlertText" class="text-base-content/90"></span>
          </div>

          <section class="grid grid-cols-1 gap-3 sm:grid-cols-3">
            <button id="cardUSD" type="button" class="card card-border text-left hover:shadow-sm transition-shadow">
              <div class="card-body gap-2">
                <div class="flex items-center justify-between gap-2">
                  <h2 class="card-title text-base">USD / RUB</h2>
                  <span id="cardUSD_delta" class="badge badge-soft">…</span>
                </div>
                <div class="text-3xl font-semibold tabular-nums" id="cardUSD_value">…</div>
                <div class="text-xs text-base-content/70" id="cardUSD_meta">…</div>
              </div>
            </button>

            <button id="cardEUR" type="button" class="card card-border text-left hover:shadow-sm transition-shadow">
              <div class="card-body gap-2">
                <div class="flex items-center justify-between gap-2">
                  <h2 class="card-title text-base">EUR / RUB</h2>
                  <span id="cardEUR_delta" class="badge badge-soft">…</span>
                </div>
                <div class="text-3xl font-semibold tabular-nums" id="cardEUR_value">…</div>
                <div class="text-xs text-base-content/70" id="cardEUR_meta">…</div>
              </div>
            </button>

            <button id="cardCNY" type="button" class="card card-border text-left hover:shadow-sm transition-shadow">
              <div class="card-body gap-2">
                <div class="flex items-center justify-between gap-2">
                  <h2 class="card-title text-base">CNY / RUB</h2>
                  <span id="cardCNY_delta" class="badge badge-soft">…</span>
                </div>
                <div class="text-3xl font-semibold tabular-nums" id="cardCNY_value">…</div>
                <div class="text-xs text-base-content/70" id="cardCNY_meta">…</div>
              </div>
            </button>
          </section>

          <section class="mt-6 card card-border">
            <div class="card-body gap-4">
              <div class="flex flex-wrap items-end gap-3">
                <label class="form-control w-full sm:w-auto">
                  <div class="label">
                    <span class="label-text">Валюта</span>
                  </div>
                  <select id="code" class="select select-bordered w-full sm:w-44"></select>
                </label>

                <label class="form-control w-full sm:w-auto">
                  <div class="label">
                    <span class="label-text">Дней</span>
                  </div>
                  <input id="days" class="input input-bordered w-full sm:w-28" type="number" min="1" max="3650" value="30" />
                </label>

                <div class="flex flex-wrap gap-2">
                  <button id="reload" class="btn btn-ghost">Обновить</button>
                  <button id="sync" class="btn btn-primary">Синхронизировать сегодня</button>
                </div>

                <div class="flex-1"></div>
                <div id="status" class="text-sm text-base-content/70"></div>
              </div>

              <div class="chart-wrap">
                <canvas id="chart" height="120"></canvas>
              </div>
            </div>
          </section>
        </section>

        <aside class="card card-border edge-banner edge-banner-right order-3">
          <div class="card-body gap-3">
            <h2 class="card-title text-base">Популярные</h2>
            <div id="favoritesRight" class="grid gap-2">
              <div class="text-sm text-base-content/70">Загружаю…</div>
            </div>
          </div>
        </aside>
        </div>
      </section>

    </main>

    <script src="/static/js/app.js" defer></script>
  </body>
</html>
